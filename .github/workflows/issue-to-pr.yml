name: Issue to PR (Claude Code)

on:
  issues:
    types: [labeled]

# ラベル "claude" が付いたIssueだけ自動対応する
# → 全Issueを自動化すると意図しない変更が入るリスクがあるため

jobs:
  create-pr:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            以下のGitHub Issueに対応してください。

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            ## 作業ルール
            - 新しいブランチを作成してください（ブランチ名: fix/issue-${{ github.event.issue.number }} または feat/issue-${{ github.event.issue.number }}）
            - コードを変更してコミットしてください
            - PRを作成し、このIssueをCloseするリンク（Closes #${{ github.event.issue.number }}）を本文に含めてください
            - コミットメッセージとPR説明は日本語で書いてください
