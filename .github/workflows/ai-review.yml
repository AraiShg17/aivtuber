name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > /tmp/pr.diff
          head -c 30000 /tmp/pr.diff > /tmp/pr_trimmed.diff

      - name: Run AI Review
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/pr_trimmed.diff', 'utf8');

            if (!diff.trim()) {
              console.log('差分がないためレビューをスキップ');
              return;
            }

            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-5',
                max_tokens: 2000,
                messages: [
                  {
                    role: 'user',
                    content: `あなたは優秀なTypeScript/Next.jsのコードレビュアーです。
以下のPR diffをレビューし、日本語で回答してください。

## レビュー観点
- バグ・潜在的な不具合
- パフォーマンス上の問題
- セキュリティリスク
- TypeScriptの型安全性
- 可読性・保守性の改善案

## 出力形式
問題がある場合は以下の形式で記載してください：

### 🔴 要修正 / 🟡 改善提案 / 🟢 良い点

**ファイル名 (行番号付近)**
> 問題の説明

**修正方針:**
具体的な修正方法を記載

特に問題がなければ「✅ 問題なし」とだけ返してください。

---

\`\`\`diff
${diff}
\`\`\``,
                  },
                ],
              }),
            });

            if (!response.ok) {
              throw new Error(`Anthropic API error: ${response.status} ${await response.text()}`);
            }

            const data = await response.json();
            const review = data.content[0].text;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 AI コードレビュー\n\n${review}\n\n---\n*Powered by Claude Sonnet*`,
            });
